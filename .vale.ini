# Path-scoped ON PURPOSE. Only the warm register is linted; `reference/`,
# `workflows/`, `architecture/` and everything under `operations/` except its
# index carry no styles at all. That split is the register table in
# tatara-agent-skills' `tatara-writing-voice` skill - change one and change the
# other in the same MR.
#
# styles/Google is VENDORED. No `Packages =` line, no `vale sync` in CI.
# See styles/Google/README-VENDORED.md.
#
# MinAlertLevel = error is load-bearing. At `warning` the same config reports
# 202 findings on this corpus, 158 of them from three rules that are wrong for
# this site: Google.Colons false-fires on every `:material-icon:` card
# shortcode (56), Google.WordListCase (55) and Google.Headings (47) demand
# sentence-case headings the whole site and its nav do not use. Do not raise it
# without rewriting every heading first.
StylesPath = styles
MinAlertLevel = error

[docs/index.md]
BasedOnStyles = Google, tatara
# Duration and config literals ("24h", "422s", "3600s") are values, not
# measurements; Google.Units wants a nonbreaking space inside them.
Google.Units = NO
# US punctuation-inside-quotes corrupts a quoted literal in technical prose.
Google.Quotes = NO

[docs/concepts/**/*.md]
BasedOnStyles = Google, tatara
Google.Units = NO
Google.Quotes = NO

[docs/getting-started/**/*.md]
BasedOnStyles = Google, tatara
Google.Units = NO
Google.Quotes = NO

[docs/explainers/**/*.md]
BasedOnStyles = Google, tatara
Google.Units = NO
Google.Quotes = NO

[docs/operations/index.md]
BasedOnStyles = Google, tatara
Google.Units = NO
Google.Quotes = NO
