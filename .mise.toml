[tools]
python = "3.12.4"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
run = "pip install -r requirements.txt"

[tasks.serve]
run = "mkdocs serve"

[tasks.build]
run = "mkdocs build --strict"

[tasks.lint]
run = [
  "./scripts/check-stale-terms.sh",
  "python3 scripts/check_runbook_anchors.py",
]

[tasks.test]
run = "python3 -m unittest discover scripts -p 'test_*.py'"
