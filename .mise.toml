[tools]
python = "3.12.14"
vale = "3.17.1"

[env]
_.python.venv = { path = ".venv", create = true }

# requirements.txt stays the pip manifest. mise owns the python version, the
# venv, and this task; nothing invokes pip directly, in CI or locally.
[tasks.install]
run = "pip install -r requirements.txt"

[tasks.serve]
run = "mkdocs serve"

[tasks.build]
run = "mkdocs build --strict"

[tasks.lint]
run = [
  "./scripts/check-stale-terms.sh",
  "python3 scripts/check_crd_keys.py",
  "python3 scripts/check_runbook_anchors.py",
  "vale docs/",
]

# Regenerate scripts/crd-keys.json from sibling checkouts. Not part of `lint`:
# the merge gate reads the COMMITTED snapshot and must stay offline. Currency is
# owned by .github/workflows/crd-keys-currency.yml.
[tasks.gen-crd-keys]
run = "python3 scripts/gen_crd_keys.py ../tatara-operator ../tatara-memory ../tatara-memory-repo-ingester ../tatara-claude-code-wrapper"

[tasks.vale]
run = "vale docs/"

[tasks.test]
run = "python3 -m unittest discover scripts -p 'test_*.py'"

# The deploy job's only step. It lives here rather than inline in the workflow
# so the command CI runs and the command a human can run are the same string.
# `--force` is mkdocs' own flag for a non-fast-forward push to gh-pages; it was
# there before this migration and its behaviour is unchanged.
[tasks.deploy]
run = "mkdocs gh-deploy --force"
