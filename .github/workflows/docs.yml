name: Deploy docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # mise now owns the toolchain in place of a dedicated python install
      # step. .mise.toml is the single source of toolchain truth for this
      # repo; `cache: true` caches the tool installs so the python build
      # does not run on every job.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run install

      - name: Check for stale pre-redesign terms
        run: ./scripts/check-stale-terms.sh

      - name: Runbook anchor guard self-tests
        run: mise exec -- python3 -m unittest discover scripts -p 'test_*.py' -v

      # docs/operations/runbooks.md is a cross-repo API: alert rules in
      # szymonrychu/tatara-observability carry a runbook_url pointing at its
      # `tatara-runbook-*` anchors, and the incident agent follows that link as phase 2 of
      # every incident turn. `mkdocs build --strict` validates INTERNAL links only, so an
      # inbound link from another repo is invisible to it and a dropped anchor ships green.
      # This asserts the anchor set is well-formed and append-only against main, so the
      # break is caught in the PR that causes it. The explicit fetch keeps the guard from
      # degrading into its own neutral skip when origin/main is not in the checkout.
      - name: Fetch main for the runbook anchor guard
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Check runbook anchor contract
        run: mise exec -- python3 scripts/check_runbook_anchors.py --base origin/main

      # .vale.ini deliberately scopes styles to the entry surface only (index,
      # concepts/, getting-started/, explainers/, operations/index.md).
      # reference/, workflows/, architecture/, and the rest of operations/ are
      # clinical by contract and carry no styles on purpose - do not widen this
      # by pointing it at all of docs/ or adding [docs/**/*.md] to .vale.ini,
      # or CI floods with findings on pages nobody is rewriting. A prose
      # failure is cheap to fix and should surface before the slower build.
      - name: Lint prose style (Vale)
        run: mise exec -- vale docs/

      - name: Build docs (strict)
        run: mise run build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run install

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: mise run deploy
